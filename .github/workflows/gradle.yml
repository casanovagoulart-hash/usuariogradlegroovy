name: PR Workflow

on:
  pull_request:
    branches: [master]   # confira se a sua branch principal é master mesmo (ou main)
    types: [opened, synchronize, reopened]

permissions:
  contents: read   # Princípio do menor privilégio para o token do workflow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle (com cache embutido)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build