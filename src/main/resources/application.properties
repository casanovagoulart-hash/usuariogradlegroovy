# ===================== IDENTIFICAÇÃO DA APLICAÇÃO =====================
# Nome da aplicação: aparece nos logs (o trecho [usuariogradlegroovy] de cada linha)
spring.application.name=usuariogradlegroovy

# ===================== SEGURANÇA (JWT) =====================
# ${JWT_SECRET}: o Spring NÃO lê o valor aqui, ele busca na variável de ambiente JWT_SECRET.
# Assim a chave real nunca vai para o GitHub.
# A chave precisa ter no mínimo 32 caracteres (256 bits) para o HS256,
# senão o JwtUtil lança erro no construtor e a aplicação nem sobe.
# Quem usa: JwtUtil (assina e confere os tokens).
jwt.secret=${JWT_SECRET}

# ===================== BANCO DE DADOS (PostgreSQL) =====================
# URL de conexão: jdbc:postgresql://servidor:porta/nome_do_banco
# localhost = este computador | 5432 = porta padrão do PostgreSQL | db_usuario_agenda = nome do banco
spring.datasource.url=jdbc:postgresql://localhost:5432/db_usuario_agenda

# Usuário do banco (o "postgres" é o administrador padrão)
spring.datasource.username=postgres

# Senha do banco: mesma ideia do JWT_SECRET, vem da variável de ambiente DB_PASSWORD
# e não fica escrita no código.
spring.datasource.password=${DB_PASSWORD}

# Driver: a "ponte" entre o Java e o PostgreSQL (vem da dependência postgresql do Gradle)
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== JPA / HIBERNATE =====================
# ddl-auto=update: o Hibernate cria e ajusta as tabelas sozinho, comparando com as @Entity.
# Ótimo para estudo. Em produção o recomendado é "validate" ou uma ferramenta de migração (Flyway).
# Outras opções: none (não faz nada), validate (só confere), create (apaga e recria tudo!).
spring.jpa.hibernate.ddl-auto=update

# show-sql=true: mostra no console o SQL que o Hibernate executa. Ótimo para aprender
# o que cada método do repository faz por baixo dos panos.
spring.jpa.show-sql=true

# open-in-view=false: a sessão do banco fecha ao sair do service.
# Por isso o buscaUsuarioporEmail precisa do @Transactional(readOnly = true):
# a lista lazy de endereços e telefones só carrega enquanto a sessão está aberta.
spring.jpa.open-in-view=false

# ===================== DOCUMENTAÇÃO DA API (springdoc) =====================
# Desligadas: a documentação automática (Swagger) não fica exposta.
# Menos superfície de ataque, uma escolha segura.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false